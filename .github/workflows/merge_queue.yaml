name: ~Merge Queue

# The merge queue waits for every required check on each group it builds.
# pr_preparation.yaml runs only on pull requests, so its title check would never
# report on a group, and every pull request would wait in the queue until it
# timed out. This workflow reports that check there, and checks out nothing.
# It has no concurrency group: each merge group the queue builds has a ref of
# its own and one run of this workflow, so no newer run supersedes an older one,
# and a group shared across refs would cancel the check of another merge group
# the queue is testing alongside it.
on: # zizmor: ignore[concurrency-limits]
  merge_group:
    branches:
      - develop

permissions: {}

jobs:
  # The queue takes only a pull request whose required checks passed, so its
  # title passed pr_preparation.yaml's lint before it joined. The job id is the
  # required check's name, so it gets no `name:`, and it must stay the same as
  # the job id in pr_preparation.yaml.
  pr-lint-title: # zizmor: ignore[anonymous-definition]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Pass the title check
        run: echo "The title passed its lint on the pull request."
