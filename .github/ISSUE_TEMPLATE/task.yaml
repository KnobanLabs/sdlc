name: Task
description: A specific piece of work that is neither a bug nor a feature
type: Task
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What needs doing, and why now?
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance Criteria
      description: How we'll know it's done, one checkable item per line.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, constraints, or the parent issue this belongs to.
