name: Feature Request
description: Suggest an improvement or a new capability
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description:
        What problem does this solve? What's currently missing or frustrating?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you'd like to see added or changed.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've thought about?
